name: Fast Link to GoFile Cloud Transfer

on:
  workflow_dispatch:
    inputs:
      url:
        description: '🔗 Paste any downloadable link (Google Drive, SourceForge, MediaFire, etc.)'
        required: true
        type: string
      gofile_token:
        description: '🔑 (Optional) GoFile API Token'
        required: false
        type: string
        default: ''

jobs:
  cloud_transfer:
    name: 🚀 10Gbps Multi-Mirror Turbo Transfer
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Tune Linux Kernel TCP & Enable Google BBR (64MB Window)
        run: |
          sudo sysctl -w net.core.default_qdisc=fq
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr
          sudo sysctl -w net.core.wmem_max=67108864
          sudo sysctl -w net.core.rmem_max=67108864
          sudo sysctl -w net.ipv4.tcp_wmem="4096 1048576 67108864"
          sudo sysctl -w net.ipv4.tcp_rmem="4096 1048576 67108864"

      - name: ⚡ Install aria2 Multi-Source Engine
        run: |
          sudo apt-get install -y --no-install-recommends aria2 curl

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Fast Dependencies
        run: |
          pip install --no-cache-dir httpx requests requests-toolbelt rich gdown click

      - name: 🚀 Execute Multi-Mirror 10Gbps Transfer
        env:
          GOFILE_TOKEN: ${{ inputs.gofile_token }}
        run: |
          python scripts/cloud_runner.py "${{ inputs.url }}"
