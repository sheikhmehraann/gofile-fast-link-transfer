name: Fast Link to GoFile Cloud Transfer

on:
  workflow_dispatch:
    inputs:
      url:
        description: '🔗 Paste any downloadable link (Google Drive, SourceForge, MediaFire, etc.)'
        required: true
        type: string
      gofile_token:
        description: '🔑 (Optional) GoFile API Token'
        required: false
        type: string
        default: ''

jobs:
  cloud_transfer:
    name: 🚀 1-Job Cloud Link Transfer
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Install aria2 Ultra-Fast C++ Engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚡ Execute Cloud Transfer
        env:
          GOFILE_TOKEN: ${{ inputs.gofile_token }}
        run: |
          python scripts/cloud_runner.py "${{ inputs.url }}"
