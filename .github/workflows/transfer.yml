name: Fast Link to GoFile Cloud Transfer

on:
  workflow_dispatch:
    inputs:
      url:
        description: '🔗 Paste any downloadable link (Google Drive, SourceForge, MediaFire, etc.)'
        required: true
        type: string
      gofile_token:
        description: '🔑 (Optional) GoFile API Token'
        required: false
        type: string
        default: ''

jobs:
  cloud_transfer:
    name: 🚀 10Gbps Cloud Turbo Transfer
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Install aria2 Acceleration Engine
        run: |
          sudo apt-get install -y --no-install-recommends aria2 curl

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Fast Dependencies
        run: |
          pip install --no-cache-dir httpx requests requests-toolbelt rich gdown click

      - name: 🚀 Execute 64-Stream 10Gbps Transfer
        env:
          GOFILE_TOKEN: ${{ inputs.gofile_token }}
        run: |
          python scripts/cloud_runner.py "${{ inputs.url }}"
