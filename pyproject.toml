[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gofile-fast-link-transfer"
version = "1.0.0"
description = "Ultra-fast parallel downloader & GoFile uploader supporting Google Drive, SourceForge, and direct links."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "sheikhmehraann"}
]
keywords = ["gofile", "downloader", "uploader", "google-drive", "sourceforge", "multi-threaded"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "requests-toolbelt>=1.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "gdown>=5.0.0",
]

[project.scripts]
gofile-transfer = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
